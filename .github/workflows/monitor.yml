name: binancezh-monitor

# 监控 @binancezh 新推文 → 推到 Server酱 → 个人微信
#
# 触发方式（双保险）：
#   1) 外部可靠触发（主）：cron-job.org 等每 5 分钟 POST 触发 workflow_dispatch
#      —— GitHub 自家 cron 是 best-effort 无 SLA、会假活停摆，故主触发源放外部
#   2) GitHub 自家 schedule（兜底）：偶尔也能跑，与外部触发撞上时由下方
#      concurrency 串行化排队，不会撞车 push
on:
  schedule:
    - cron: "*/5 * * * *"   # UTC 时间；GitHub cron 可能延迟/丢弃，仅作兜底
  workflow_dispatch:        # 手动/外部触发（cron-job.org 走这里）
    inputs:
      mode:
        description: "check=检查新推文并推送  test-push=只发一条测试推送"
        type: choice
        options:
          - check
          - test-push
        default: check

# 同一 ref 最多同时跑 1 个；新触发排队等待，不取消进行中的运行
# —— 避免外部 dispatch 与兜底 schedule 在几秒内撞上、保存状态步 push 抢推报红 ✗
concurrency:
  group: monitor-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 允许把去重状态提交回仓库

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # ---------- 手动测试推送 ----------
      - name: 测试推送
        if: inputs.mode == 'test-push'
        env:
          PUSH_MODE: serverchan
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python monitor.py --test-push

      # ---------- 正常监控 ----------
      - name: 执行监控检查
        if: inputs.mode != 'test-push'
        env:
          SOURCE_MODE: syndication          # Twitter 官方 widget 接口，免登录
          TW_SCREEN_NAME: binancezh
          PUSH_MODE: serverchan
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          STATE_FILE: .last_seen.json
        run: python monitor.py --once

      # ---------- 保存去重状态 ----------
      # 每次运行都提交，保持仓库活跃（防 schedule 被 60 天无提交停用）
      # push 前先 pull --rebase，与并发运行的提交合并，消除撞车红 ✗
      - name: 保存状态到仓库
        if: inputs.mode != 'test-push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last_seen.json || true
          if ! git diff --staged --quiet; then
            # 拉取远端最新（含并发运行刚推的提交），变基后再推，避免 rejected
            git pull --rebase origin main || true
            git commit -m "chore: 更新监控状态 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
